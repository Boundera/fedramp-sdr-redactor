name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm check:web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist-web
